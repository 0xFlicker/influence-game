name: "TEMPORARY: Production Approval Principal Proof"
run-name: "Approval principal proof / ${{ github.event_name }}"

on:
  workflow_dispatch:
  repository_dispatch:
    types: [influence-production-approval-proof-requested]

permissions:
  actions: read
  contents: read

jobs:
  request-proof:
    name: Ask the App to create a harmless proof run
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate proof-dispatch token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: 0xFlicker
          repositories: influence-game
          permission-contents: write

      - name: Create App-authored approval proof
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: '0xFlicker',
              repo: 'influence-game',
              event_type: 'influence-production-approval-proof-requested',
              client_payload: {}
            });

  approve-proof:
    name: Approve harmless sole-maintainer proof
    if: ${{ github.event_name == 'repository_dispatch' && github.actor == 'flick-ai-dev[bot]' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@v4

      - name: Generate policy verification token
        id: policy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: 0xFlicker
          repositories: influence-game
          permission-environments: read

      - name: Verify App principal, approval, and policy
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
        run: |
          jq -e '
            .action == "influence-production-approval-proof-requested"
            and .sender.login == "flick-ai-dev[bot]"
            and .sender.id == 270169057
          ' "$GITHUB_EVENT_PATH" >/dev/null
          bash scripts/production-approval.sh verify-policy proof-policy
          {
            echo "## Sole-maintainer approval proof passed"
            echo
            echo "- Run actor: \`$GITHUB_ACTOR\`"
            echo "- App actor ID: \`270169057\`"
            echo "- Required reviewer: \`0xFlicker\`"
            echo "- Production callback: \`none\`"
            echo "- Host authority: \`none\`"
            echo
            echo "> Remove this temporary workflow after recording the successful proof and before enabling Linode execution receivers."
          } >> "$GITHUB_STEP_SUMMARY"
