name: Mirror production renderer to ECR
run-name: Production renderer ${{ github.event.workflow_run.id || inputs.source_run_id }}
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful ordinary main CI run producing the exact three-image manifest
        required: true
        type: string
      publish:
        description: Copy exact worker to production ECR; false measures only
        default: false
        type: boolean
  pull_request:
    paths:
      - .github/workflows/production-renderer-ecr.yml
      - scripts/staging-ecr-mirror.py
      - scripts/test_staging_ecr_mirror.py
permissions:
  contents: read
concurrency:
  group: production-renderer-image-mirror
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p test_staging_ecr_mirror.py
  release:
    if: github.repository_id == '1183905474' && github.repository_owner_id == '97764360' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (vars.HOUSE_PROD_RENDER_IMAGES_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.id == 1183905474))
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      build_run_id: ${{ steps.release.outputs.build_run_id }}
      build_run_attempt: ${{ steps.release.outputs.build_run_attempt }}
      manifest: ${{ steps.release.outputs.release_manifest_artifact }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify terminal ordinary main CI and exact release evidence
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          python3 scripts/staging-release-source.py --run-metadata source-run.json --output release-selection.json
  mirror:
    needs: release
    if: needs.release.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Restore and independently verify production image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.release.outputs.build_run_id }}
          SOURCE_ATTEMPT: ${{ needs.release.outputs.build_run_attempt }}
          MANIFEST: ${{ needs.release.outputs.manifest }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_ATTEMPT" > source-run.json
          python3 - <<'PYCODE'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('mirror','scripts/staging-ecr-mirror.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.source_run('prod-worker',json.load(open('source-run.json')))
          PYCODE
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$MANIFEST" --dir source-evidence
      - name: Install the distribution image-copy tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Authenticate only to this repository's existing GHCR package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/production-ecr-auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Measure exact source manifest and compressed content
        run: python3 scripts/staging-ecr-mirror.py --kind prod-worker --run-metadata source-run.json --evidence source-evidence/release-manifest.json --auth-file "$RUNNER_TEMP/production-ecr-auth.json" --output image-measurement.json
      - name: Assume the dedicated publisher only for an approved copy
        if: (github.event_name == 'workflow_run' || inputs.publish) && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-1
          allowed-account-ids: '978355607658'
          role-to-assume: arn:aws:iam::978355607658:role/house/render/prod/publish/HouseRenderProdWorkerImagePublisher
          role-duration-seconds: 900
          unset-current-credentials: true
      - name: Authenticate to ECR with temporary IAM authorization
        if: (github.event_name == 'workflow_run' || inputs.publish) && github.ref == 'refs/heads/main'
        run: aws ecr get-login-password --region us-west-1 | skopeo login --authfile "$RUNNER_TEMP/production-ecr-auth.json" --username AWS --password-stdin 978355607658.dkr.ecr.us-west-1.amazonaws.com
      - name: Preserve all manifests and verify destination digest
        if: (github.event_name == 'workflow_run' || inputs.publish) && github.ref == 'refs/heads/main'
        env:
          MANIFEST_LIMIT: '5'
        run: python3 scripts/staging-ecr-mirror.py --kind prod-worker --run-metadata source-run.json --evidence source-evidence/release-manifest.json --auth-file "$RUNNER_TEMP/production-ecr-auth.json" --output mirror-receipt.json --max-manifests "$MANIFEST_LIMIT" --publish
      - name: Bind verified publication to this exact workflow attempt
        if: (github.event_name == 'workflow_run' || inputs.publish) && github.ref == 'refs/heads/main'
        id: receipt
        run: echo "digest=sha256:$(sha256sum mirror-receipt.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload attempt-bound worker publication evidence
        if: (github.event_name == 'workflow_run' || inputs.publish) && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: production-worker-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: mirror-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary registry authentication
        if: always()
        run: rm -f "$RUNNER_TEMP/production-ecr-auth.json"
