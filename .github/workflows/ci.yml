name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      proof_publication:
        description: Publish only the exact staging-policy proof branch; never deploy or move staging tags
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check character worker platform diagnostics
        run: python3 -m unittest discover -s workers/character-cutouts -p 'test_*.py'

      - name: Check isolated proof publication source guards
        run: python3 -m unittest discover -s scripts -p 'test_staging_proof_source.py'

      - name: Enforce release migration policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DRIZZLE_MIGRATIONS_DIR: ./packages/api/drizzle
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            comparison_base="$BASE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            comparison_base="$(git rev-parse HEAD^)"
          else
            comparison_base="$(git hash-object -t tree /dev/null)"
          fi

          mapfile -t migration_files < <(
            git diff --name-only --diff-filter=AM "$comparison_base" "$GITHUB_SHA" -- 'packages/api/drizzle/*.sql'
          )
          bun run packages/api/src/db/migrate.ts --check-release-compatibility "${migration_files[@]}"

          calculated_set="$(bun run packages/api/src/db/migrate.ts --print-release-migration-set)"
          manifest_hash="$({
            cd packages/api
            find drizzle -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          } | sha256sum | awk '{ print $1 }')"
          test "$calculated_set" = "sha256:$manifest_hash"
          echo "Release migration set: $calculated_set"

      - name: Enforce staging E2E candidate contract
        run: bash scripts/test-e2e-candidate-contract.sh

      - name: Enforce production approval broker contract
        run: bash scripts/test-production-approval-contract.sh

      - name: Exercise production approval broker verifier
        run: bash scripts/test-production-approval-behavior.sh

      - name: Enforce test lane classification
        run: bun run test:classification

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  provider-free:
    name: Provider-free tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run automatically discovered provider-free tests
        run: bun run test:provider-free

  api-postgres-shards:
    name: API / PostgreSQL shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Each matrix job owns its runner and PostgreSQL service. Tests within a
    # shard remain sequential because setupTestDB truncates their shared DB.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: influence
          POSTGRES_PASSWORD: influence
          POSTGRES_DB: influence_test
        ports:
          - 54320:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://influence:influence@127.0.0.1:54320/influence_test

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Studio audio fixtures exercise real container validation and duration probing.
      - name: Install audio test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run automatically discovered API test shard serially
        run: bun run test:postgres --shard=${{ matrix.shard }}/4

  api-postgres:
    # Preserve the required check name and the release-manifest dependency.
    name: API / PostgreSQL tests
    needs: [api-postgres-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every PostgreSQL shard to pass
        env:
          SHARD_RESULT: ${{ needs.api-postgres-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::PostgreSQL shards did not all pass: $SHARD_RESULT"
            exit 1
          fi

  api-pr-build:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build API runtime
        run: docker build -f Dockerfile.api -t influence-api:pr-check .
      - name: Verify packaged images and both API roles
        run: bash scripts/test-api-image.sh influence-api:pr-check

  render-worker-pr-build:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build render worker
        run: docker build -f Dockerfile.render-worker -t influence-render-worker:pr-check .

      - name: Verify render worker runtime
        run: |
          docker run --rm --entrypoint sh influence-render-worker:pr-check -ec '
            ffmpeg -version >/dev/null
            chromium --version >/dev/null
            test "$(find /app/music/house-highlights-variants -name "*.m4a" | wc -l)" -ge 24
          '

  release-scope:
    if: ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.proof_publication && startsWith(github.ref, 'refs/heads/proof/staging-render-') && github.repository_id == '1183905474' && github.actor_id == '97764360')
    runs-on: ubuntu-latest
    outputs:
      release_required: ${{ steps.scope.outputs.release_required }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect release image input changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
          PROOF_PUBLICATION: ${{ inputs.proof_publication }}
        run: |
          if [ "$PROOF_PUBLICATION" = true ]; then
            [[ "$GITHUB_REF" == refs/heads/proof/staging-render-* ]]
            # Use main's verifier, not code supplied by the proof branch.
            git show origin/main:scripts/staging-proof-source.py > "$RUNNER_TEMP/proof-source.py"
            python3 "$RUNNER_TEMP/proof-source.py" --candidate "$GITHUB_SHA" --output proof-source.json
            echo "release_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "release_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            comparison_base="$BASE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            comparison_base="$(git rev-parse HEAD^)"
          else
            comparison_base="$(git hash-object -t tree /dev/null)"
          fi

          if git diff --quiet "$comparison_base" "$GITHUB_SHA" -- \
            Dockerfile.api Dockerfile.web Dockerfile.render-worker \
            .dockerignore package.json bun.lock bunfig.toml tsconfig.json scripts/test-api-image.sh \
            packages/api/ packages/engine/ packages/prompt-lab-protocol/ packages/web/ \
            deployment/ music/house-highlights-variants/ music/werewolf/; then
            echo "release_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_required=true" >> "$GITHUB_OUTPUT"
          fi

  docker-build-push:
    if: (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !inputs.proof_publication) || (github.event_name == 'workflow_dispatch' && inputs.proof_publication && startsWith(github.ref, 'refs/heads/proof/staging-render-') && github.repository_id == '1183905474' && github.actor_id == '97764360')) && needs.release-scope.outputs.release_required == 'true'
    needs: [check, release-scope]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            dockerfile: Dockerfile.api
            image: ghcr.io/0xflicker/influence-api
            digest_artifact: digest-api
            build_args: ""
          - target: web
            dockerfile: Dockerfile.web
            image: ghcr.io/0xflicker/influence-web
            digest_artifact: digest-web
            build_args: '--build-arg PRIVY_APP_ID="$PRIVY_APP_ID"'
          - target: render-worker
            dockerfile: Dockerfile.render-worker
            image: ghcr.io/0xflicker/influence-render-worker
            digest_artifact: digest-render-worker
            build_args: ""
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        env:
          PROOF_PUBLICATION: ${{ inputs.proof_publication }}
        run: |
          if [ "$PROOF_PUBLICATION" = true ]; then
            echo "short=render-proof-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          else
            echo "short=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.target }}
        env:
          PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ !inputs.proof_publication && matrix.target == 'web' && secrets.POSTHOG_PERSONAL_API_KEY || '' }}
          PROOF_PUBLICATION: ${{ inputs.proof_publication }}
        run: |
          posthog_args=()
          mutable_tag_args=()
          if [ "$PROOF_PUBLICATION" != true ]; then
            mutable_tag_args=(-t ${{ matrix.image }}:staging)
          fi
          if [ "${{ matrix.target }}" = "web" ] && [ "$PROOF_PUBLICATION" != true ]; then
            posthog_args=(--build-arg POSTHOG_UPLOAD_SOURCEMAPS=1 --secret id=posthog_api_key,env=POSTHOG_PERSONAL_API_KEY)
          fi
          docker build -f ${{ matrix.dockerfile }} \
            --build-arg GIT_SHA=${{ github.sha }} \
            "${posthog_args[@]}" \
            ${{ matrix.build_args }} \
            -t ${{ matrix.image }}:${{ steps.sha.outputs.short }} \
            "${mutable_tag_args[@]}" \
            .
          if [ "$PROOF_PUBLICATION" = true ] && [ "${{ matrix.target }}" != web ]; then
            docker run --rm --entrypoint cat ${{ matrix.image }}:${{ steps.sha.outputs.short }} /app/deployment/render-execution.json > packaged-policy.json
            cmp deployment/render-execution.json packaged-policy.json
          fi
          if [ "${{ matrix.target }}" = "render-worker" ]; then
            docker run --rm --entrypoint sh ${{ matrix.image }}:${{ steps.sha.outputs.short }} -ec '
              ffmpeg -version >/dev/null
              chromium --version >/dev/null
              timeout --version >/dev/null
              test "$(find /app/music/house-highlights-variants -name "*.m4a" | wc -l)" -ge 24
            '
          fi
          if [ "${{ matrix.target }}" = "api" ]; then
            bash scripts/test-api-image.sh ${{ matrix.image }}:${{ steps.sha.outputs.short }}
          fi
          push_output="$(docker push ${{ matrix.image }}:${{ steps.sha.outputs.short }})"
          printf '%s\n' "$push_output"
          immutable_digest="$(awk '$2 == "digest:" { print $3 }' <<< "$push_output" | tail -n 1)"
          if ! [[ "$immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "immutable push did not report a valid digest for ${{ matrix.target }}" >&2
            exit 1
          fi
          printf '%s\n' "$immutable_digest" > "${{ matrix.target }}.digest"
          if [ "$PROOF_PUBLICATION" != true ]; then
            docker push ${{ matrix.image }}:staging
          fi

      - name: Upload ${{ matrix.target }} digest evidence
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.digest_artifact }}
          path: ${{ matrix.target }}.digest
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release-manifest:
    if: ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !inputs.proof_publication) || (github.event_name == 'workflow_dispatch' && inputs.proof_publication && startsWith(github.ref, 'refs/heads/proof/staging-render-') && github.repository_id == '1183905474' && github.actor_id == '97764360')
    # Images may build in parallel, but only a fully verified candidate is releasable.
    needs: [check, provider-free, api-postgres, docker-build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.manifest.outputs.candidate_sha }}
      api_digest: ${{ steps.manifest.outputs.api_digest }}
      web_digest: ${{ steps.manifest.outputs.web_digest }}
      worker_digest: ${{ steps.manifest.outputs.worker_digest }}
      migration_set: ${{ steps.manifest.outputs.migration_set }}
      artifact_name: ${{ steps.manifest.outputs.artifact_name }}
      manifest_digest: ${{ steps.manifest.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Download immutable service digests
        uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          path: release-digests
          merge-multiple: true

      - name: Aggregate exact release manifest
        id: manifest
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate SHA must be a full lowercase git SHA" >&2
            exit 64
          fi

          mapfile -t digest_files < <(find release-digests -maxdepth 1 -type f -name '*.digest' -print | LC_ALL=C sort)
          if [ "${#digest_files[@]}" -ne 3 ]; then
            echo "expected exactly three service digest artifacts, found ${#digest_files[@]}" >&2
            exit 1
          fi

          api_digest="$(tr -d '\n' < release-digests/api.digest)"
          web_digest="$(tr -d '\n' < release-digests/web.digest)"
          worker_digest="$(tr -d '\n' < release-digests/render-worker.digest)"
          for digest in "$api_digest" "$web_digest" "$worker_digest"; do
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "release manifest contains an invalid service digest" >&2
              exit 1
            fi
          done

          migration_hash="$({
            cd packages/api
            find drizzle -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          } | sha256sum | awk '{ print $1 }')"
          migration_set="sha256:${migration_hash}"
          artifact_name="influence-release-manifest-${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          jq -n \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg api_digest "$api_digest" \
            --arg web_digest "$web_digest" \
            --arg worker_digest "$worker_digest" \
            --arg migration_set "$migration_set" \
            --argjson build_run_id "$GITHUB_RUN_ID" \
            --argjson build_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema_version: 1,
              candidate_sha: $candidate_sha,
              build_run_id: $build_run_id,
              build_run_attempt: $build_run_attempt,
              migration_set: $migration_set,
              images: {
                api: { digest: $api_digest },
                web: { digest: $web_digest },
                render_worker: { digest: $worker_digest }
              }
            }' > release-manifest.json

          manifest_digest="sha256:$(sha256sum release-manifest.json | awk '{ print $1 }')"
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "api_digest=$api_digest"
            echo "web_digest=$web_digest"
            echo "worker_digest=$worker_digest"
            echo "migration_set=$migration_set"
            echo "artifact_name=$artifact_name"
            echo "manifest_digest=$manifest_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Upload exact release manifest
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 14

  trigger-deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !inputs.proof_publication
    needs: release-manifest
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ needs.release-manifest.outputs.candidate_sha }}
      API_DIGEST: ${{ needs.release-manifest.outputs.api_digest }}
      WEB_DIGEST: ${{ needs.release-manifest.outputs.web_digest }}
      WORKER_DIGEST: ${{ needs.release-manifest.outputs.worker_digest }}
      MIGRATION_SET: ${{ needs.release-manifest.outputs.migration_set }}
      RELEASE_MANIFEST_ARTIFACT: ${{ needs.release-manifest.outputs.artifact_name }}
      RELEASE_MANIFEST_DIGEST: ${{ needs.release-manifest.outputs.manifest_digest }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: 0xFlicker
          repositories: linode-iac

      - name: Trigger staging deploy
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: '0xFlicker',
              repo: 'linode-iac',
              workflow_id: 'deploy-staging.yml',
              ref: 'main',
              inputs: {
                candidate_sha: process.env.CANDIDATE_SHA,
                api_digest: process.env.API_DIGEST,
                web_digest: process.env.WEB_DIGEST,
                worker_digest: process.env.WORKER_DIGEST,
                migration_set: process.env.MIGRATION_SET,
                build_run_id: String(context.runId),
                build_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
                release_manifest_artifact: process.env.RELEASE_MANIFEST_ARTIFACT,
                release_manifest_digest: process.env.RELEASE_MANIFEST_DIGEST
              }
            });
