name: "E2E Staging Tests"
run-name: "E2E staging / ${{ inputs.image_tag }}"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable 7-40 character git SHA image tag deployed to staging"
        required: true

permissions:
  contents: read

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployed image tag
        env:
          STAGING_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$STAGING_IMAGE_TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "image_tag must be an immutable lowercase git SHA" >&2
            exit 64
          fi

      - name: Checkout source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deployed source identity
        id: source-identity
        env:
          STAGING_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          expected_sha="$(git rev-parse --verify "${STAGING_IMAGE_TAG}^{commit}")"
          if [[ "$expected_sha" != "$STAGING_IMAGE_TAG"* ]]; then
            echo "resolved commit $expected_sha does not match requested image tag $STAGING_IMAGE_TAG" >&2
            exit 1
          fi
          echo "commit_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved deployed source commit $expected_sha for image tag $STAGING_IMAGE_TAG"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Wait for Tailscale connectivity
        run: |
          for i in $(seq 1 30); do
            if tailscale ping --timeout 2s influence-staging 2>/dev/null; then
              echo "Tailscale connection established"
              exit 0
            fi
            echo "Waiting for Tailscale... ($i/30)"
            sleep 2
          done
          echo "Failed to connect to influence-staging via Tailscale"
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bunx playwright test --retries=0
        env:
          PLAYWRIGHT_BASE_URL: http://influence-staging
          STAGING_RELEASE_GATE: "1"
          STAGING_IMAGE_TAG: ${{ inputs.image_tag }}
          STAGING_EXPECTED_COMMIT_SHA: ${{ steps.source-identity.outputs.commit_sha }}

      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-failure-${{ inputs.image_tag }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
