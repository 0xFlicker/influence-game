name: Mirror staging renderer to ECR
on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      source_run_attempt:
        default: ''
        type: string
      publish:
        required: true
        type: boolean
      max_manifests:
        default: '5'
        type: string
    outputs:
      mirror_run_id:
        value: ${{ jobs.mirror.outputs.mirror_run_id }}
      mirror_run_attempt:
        value: ${{ jobs.mirror.outputs.mirror_run_attempt }}
      mirror_receipt_digest:
        value: ${{ jobs.mirror.outputs.mirror_receipt_digest }}
  pull_request:
    paths:
      - .github/workflows/staging-renderer-ecr.yml
      - scripts/staging-ecr-mirror.py
      - scripts/test_staging_ecr_mirror.py
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main CI or independently verified isolated-proof publication run
        type: string
        required: true
      publish:
        description: Copy to ECR only after exact image/IAM publication approval; false measures metadata only
        type: boolean
        default: false
      max_manifests:
        description: Deprecated compatibility input; OCI object count does not limit publication
        type: choice
        options: ['5', '6', '7', '8', '9', '10']
        default: '5'
permissions:
  contents: read
concurrency:
  group: staging-renderer-image-mirror
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_staging_ecr_mirror.py'
  mirror:
    # The owner may inspect metadata on a review branch. AWS publication remains main-only.
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.id == 1183905474)) && github.repository_id == '1183905474' && github.repository_owner_id == '97764360' && (github.ref == 'refs/heads/main' || (!inputs.publish && github.actor_id == '97764360'))
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    outputs:
      mirror_run_id: ${{ github.run_id }}
      mirror_run_attempt: ${{ github.run_attempt }}
      mirror_receipt_digest: ${{ steps.receipt.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify source run before downloading release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"
          if [ -n "$SOURCE_ATTEMPT" ]; then
            [[ "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            endpoint="$endpoint/attempts/$SOURCE_ATTEMPT"
          fi
          gh api "$endpoint" > source-run.json
          source_branch="$(python3 -c 'import json; print(json.load(open("source-run.json"))["head_branch"])')"
          if [ "$source_branch" != main ]; then
            python3 scripts/staging-proof-source.py --run-metadata source-run.json --output verified-proof-run.json
            mv verified-proof-run.json source-run.json
          fi
          artifact="$(python3 - <<'PY'
          import importlib.util, json
          spec = importlib.util.spec_from_file_location('mirror', 'scripts/staging-ecr-mirror.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          run = json.load(open('source-run.json')); sha = m.source_run('worker', run)
          print(f"influence-release-manifest-{sha}-{run['id']}-{run['run_attempt']}")
          PY
          )"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir source-evidence
      - name: Install the distribution image-copy tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Authenticate only to this repository's existing GHCR package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/staging-ecr-auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Measure exact source manifest and compressed content
        run: python3 scripts/staging-ecr-mirror.py --kind worker --run-metadata source-run.json --evidence source-evidence/release-manifest.json --auth-file "$RUNNER_TEMP/staging-ecr-auth.json" --output image-measurement.json
      - name: Assume the dedicated publisher only for an approved copy
        if: inputs.publish && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-1
          allowed-account-ids: '978355607658'
          role-to-assume: arn:aws:iam::978355607658:role/house/render/staging/publish/HouseRenderStagingWorkerImagePublisher
          role-duration-seconds: 900
          unset-current-credentials: true
      - name: Authenticate to ECR with temporary IAM authorization
        if: inputs.publish && github.ref == 'refs/heads/main'
        run: aws ecr get-login-password --region us-west-1 | skopeo login --authfile "$RUNNER_TEMP/staging-ecr-auth.json" --username AWS --password-stdin 978355607658.dkr.ecr.us-west-1.amazonaws.com
      - name: Preserve all manifests and verify destination digest
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          MANIFEST_LIMIT: ${{ inputs.max_manifests }}
        run: python3 scripts/staging-ecr-mirror.py --kind worker --run-metadata source-run.json --evidence source-evidence/release-manifest.json --auth-file "$RUNNER_TEMP/staging-ecr-auth.json" --output mirror-receipt.json --max-manifests "$MANIFEST_LIMIT" --publish
      - name: Bind verified publication to this exact workflow attempt
        if: inputs.publish && github.ref == 'refs/heads/main'
        id: receipt
        run: echo "digest=sha256:$(sha256sum mirror-receipt.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload attempt-bound worker publication evidence
        if: inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: staging-worker-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: mirror-receipt.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v6
        with:
          name: staging-worker-image-receipt
          path: |
            image-measurement.json
            mirror-receipt.json
          retention-days: 30
      - name: Remove temporary registry authentication
        if: always()
        run: rm -f "$RUNNER_TEMP/staging-ecr-auth.json"
