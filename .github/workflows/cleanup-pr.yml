name: "Cleanup PR Ephemeral"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to clean up"
        required: true

jobs:
  trigger-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR number
        id: validate
        shell: bash
        env:
          RAW_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ ! "$RAW_PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number must be a positive decimal integer."
            exit 1
          fi
          pr_number="$(printf '%s' "$RAW_PR_NUMBER" | sed 's/^0*//')"
          if [[ -z "$pr_number" ]]; then
            echo "::error::PR number must be greater than zero."
            exit 1
          fi
          if (( ${#pr_number} > 16 )) || { (( ${#pr_number} == 16 )) && [[ "$pr_number" > "9007199254740991" ]]; }; then
            echo "::error::PR number must be a safe integer."
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: 0xFlicker
          repositories: linode-iac

      - name: Trigger ephemeral cleanup
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
          SOURCE_REPO: ${{ github.repository }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: '0xFlicker',
              repo: 'linode-iac',
              workflow_id: 'cleanup-ephemeral.yml',
              ref: 'main',
              inputs: {
                pr_number: process.env.PR_NUMBER,
                source_repo: process.env.SOURCE_REPO
              }
            });
