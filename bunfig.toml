[install]
# Filter newly resolved npm package versions until they are at least 7 days old.
minimumReleaseAge = 604800

[test]
timeout = 120000
pathIgnorePatterns = [
  "**/docs/simulations/**", # Preserved evaluation source snapshots are evidence, not executable suites.
  "**/e2e/**",
  "**/*live-provider*",
  "**/*external-smoke*",
]
